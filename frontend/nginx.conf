# harness-textrpg web 容器内 nginx：React 静态 SPA + 家族缓存形状
# （/api 不在此处理——VPS vhost 把 /api/ 直接反代 api 容器 5413，不落本容器）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 指纹化产物（Vite /assets/ 哈希文件名）：immutable 长缓存
    # （文件内容变 = URL 变，永不陈缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML：no-cache（每次回源校验）；SPA 路由回退 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
